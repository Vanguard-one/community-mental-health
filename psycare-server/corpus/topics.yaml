# =============================================================
# 合成语料主题清单（Phase 3 · 阶段一）
#
# ⚠️ 用途边界（计划 5.4.3）：合成语料**只能验链路、构建评测集、做演示**。
#    它本质是「模型关于医疗知识的记忆的再表述」，**可能包含错误**，
#    **不得用于任何对外回答**。因此 source_type 强制标 SYNTHETIC，
#    前端引用卡片必须显示「合成示例数据」角标，上线前由 rebuild 流程整体替换。
#
# 主题域与项目现有数据对齐（这样 AI 才能引用「你上个月 PHQ-9 是 12 分」这类具体事实）：
#   量表条目解释   → scale / scale_item
#   计分与分级含义 → scale.level 分级规则
#   常见症状科普   → AlertEngine 的预警类型
#   危机干预流程   → CrisisDetector 词表（知识 vs 拦截的分工）
#   药物常识       → 必须含「遵医嘱」限定语
#   就诊与转介指引 → 医生推荐逻辑
#
# 生成方式：python .workbuddy/scripts/gen_synthetic_corpus.py
# =============================================================

defaults:
  source_type: SYNTHETIC
  publish_year: 2024
  # 每条生成的正文长度区间（字）。400–600 字 → 切成 1–2 个子块，
  # 既够形成独立的检索单元，又不至于一个子块里塞进多个主题。
  min_chars: 380
  max_chars: 560

# 生成时的统一约束（会拼进 system prompt）
constraints:
  - 用中文，面向普通居民，避免术语堆砌；必要的术语要给一句话解释。
  - 只写「是什么 / 为什么 / 一般怎么做」，不写具体用药剂量、不写诊断标准数值。
  - 涉及用药的段落必须出现「具体用药请遵医嘱」。
  - 不要出现具体机构名、医生姓名、电话或网址。
  - 不确定的内容要写「建议咨询医生」，不要编造。

domains:

  # ---------- 1. 量表条目解释（对齐 scale / scale_item） ----------
  - doc_title: 心理量表条目说明（合成语料）
    domain: 量表条目解释
    tags: [量表, PHQ-9, GAD-7, 条目]
    topics:
      - section: 第 1 节 PHQ-9 患者健康问卷 / 1.1 量表用途与适用人群
        brief: PHQ-9 用于筛查抑郁症状的严重程度，共 9 个条目，回顾期为最近两周。说明自评方式与不用于诊断的边界。
      - section: 第 1 节 PHQ-9 患者健康问卷 / 1.2 题目形式与作答方式
        brief: 每题四个等级（完全没有 / 有几天 / 一半以上时间 / 几乎每天）的含义差异，以及作答时容易出现的两种偏差（按最好的一天答、按最差的一天答）。
      - section: 第 1 节 PHQ-9 患者健康问卷 / 1.3 第 1、2 题问的是什么
        brief: 兴趣减退与情绪低落这两个核心症状为什么被放在最前面，以及它们与「一时心情不好」的区别。
      - section: 第 1 节 PHQ-9 患者健康问卷 / 1.4 第 3 题睡眠
        brief: 入睡困难、易醒、早醒、睡眠过多几种表现，以及睡眠变化为什么要单独问。
      - section: 第 1 节 PHQ-9 患者健康问卷 / 1.5 第 4 题精力
        brief: 疲乏与「懒」的区别：疲乏是做完日常事情就耗尽，休息也补不回来。
      - section: 第 1 节 PHQ-9 患者健康问卷 / 1.6 第 5 题食欲与体重
        brief: 食欲下降或增加、体重变化的观察方法，以及需要提示就医的情况。
      - section: 第 1 节 PHQ-9 患者健康问卷 / 1.7 第 6 题自我评价
        brief: 自责、觉得自己失败、让家人失望这类想法，与正常反省的差别。
      - section: 第 1 节 PHQ-9 患者健康问卷 / 1.8 第 7 题注意力
        brief: 注意力难以集中、看东西看不进去的常见表现，及其与睡眠不足、焦虑的交叉。
      - section: 第 1 节 PHQ-9 患者健康问卷 / 1.9 第 8 题动作与语速
        brief: 坐立不安或动作迟缓（别人能看出来的程度）该如何理解和描述。
      - section: 第 1 节 PHQ-9 患者健康问卷 / 1.10 第 9 题自伤念头
        brief: 这一题为什么必须认真作答；有念头不等于会去做；一旦出现应尽快联系专业人员或热线。
      - section: 第 2 节 GAD-7 广泛性焦虑量表 / 2.1 量表用途与七个条目
        brief: GAD-7 用于筛查焦虑症状，回顾期同为最近两周，共 7 个条目。
      - section: 第 2 节 GAD-7 广泛性焦虑量表 / 2.2 条目含义解读
        brief: 紧张、无法停止担心、难以放松、坐不住、易激惹、害怕出事、注意力受影响七条的具体表现。
      - section: 第 2 节 GAD-7 广泛性焦虑量表 / 2.3 焦虑与担心的区别
        brief: 正常的担心有具体对象、会随着事情结束而缓解；广泛性焦虑的担心更弥散、更难停下。
      - section: 第 3 节 PSS-10 知觉压力量表 / 3.1 量表用途
        brief: PSS-10 测的是「过去一个月感到不可预测、无法控制、超负荷」的程度，不是测症状。
      - section: 第 3 节 PSS-10 知觉压力量表 / 3.2 反向计分条目
        brief: 其中若干条是正向表述、需要反向计分，作答时要按「实际情况」而不是「应该怎样」来选。
      - section: 第 4 节 自评量表作答的通用建议
        brief: 回忆最近两周的总体情况而不是某一天；按实际发生频率作答；不确定时不要跳题；自评结果不能替代专业评估。

  # ---------- 2. 计分与分级含义（对齐 scale.level） ----------
  - doc_title: 量表计分与分级含义（合成语料）
    domain: 计分与分级含义
    tags: [计分, 分级, 风险等级]
    topics:
      - section: 第 1 节 总分是怎么算出来的 / 1.1 条目计分规则
        brief: 每条按频率计 0 至 3 分，总分等于各条目之和；解释「总分高」反映的是症状负担而非某一条特别严重。
      - section: 第 1 节 总分是怎么算出来的 / 1.2 为什么总分相同情况可能不同
        brief: 九个条目都答 1 分，与个别条目答 3 分其余为 0，总分可能接近，但临床意义不同。
      - section: 第 1 节 总分是怎么算出来的 / 1.3 单条高危要单独看
        brief: 自伤念头这一条不论总分高低都应单独关注，不能因为总分不高就忽略。
      - section: 第 2 节 PHQ-9 分级对照 / 2.1 0 至 4 分（无明显症状）
        brief: 该区间的一般含义与建议：保持规律作息、关注情绪变化即可。
      - section: 第 2 节 PHQ-9 分级对照 / 2.2 5 至 9 分（轻度）
        brief: 轻度区间的含义与建议：先从睡眠、运动、社会支持入手，必要时寻求心理咨询。
      - section: 第 2 节 PHQ-9 分级对照 / 2.3 10 至 14 分（中度）
        brief: 中度的含义与建议：建议主动联系专业人员评估，不宜仅靠自我调节。
      - section: 第 2 节 PHQ-9 分级对照 / 2.4 15 分及以上（中重度及以上）
        brief: 该区间的含义与建议：尽快就诊；若伴自伤念头应立即联系专业人员或热线。
      - section: 第 3 节 GAD-7 分级对照
        brief: 5、10、15 三个分界点对应的轻度、中度、重度含义，以及与 PHQ-9 联合解读时的注意点。
      - section: 第 4 节 分级不等于诊断 / 4.1 筛查工具与诊断的区别
        brief: 量表是筛选与量化工具，诊断需要专业人员结合病史、功能受损与排除其他原因。
      - section: 第 4 节 分级不等于诊断 / 4.2 分数会波动
        brief: 同一人不同时间的分数受睡眠、身体疾病、生活事件影响，看趋势比看单次更有意义。
      - section: 第 4 节 分级不等于诊断 / 4.3 系统里的风险等级是什么
        brief: 系统根据测评结果给出风险等级，仅用于提示关注优先级，请以专业人员的判断为准。
      - section: 第 5 节 趋势怎么看
        brief: 相邻两次测评总分上升、持续处于中重度区间、或功能明显下降时，都提示需要尽快复评。

  # ---------- 3. 常见症状科普（对齐 AlertEngine 预警类型） ----------
  - doc_title: 常见心理症状科普（合成语料）
    domain: 常见症状科普
    tags: [症状, 科普, 睡眠, 情绪]
    topics:
      - section: 第 1 节 情绪低落 / 1.1 表现
        brief: 持续的情绪低落、兴趣与愉悦感下降，且与处境不完全相称，持续时间较长。
      - section: 第 1 节 情绪低落 / 1.2 什么时候该求助
        brief: 持续两周以上、影响工作学习与人际、或出现自伤念头时，应尽快联系专业人员。
      - section: 第 2 节 焦虑与躯体反应 / 2.1 心慌手抖出汗
        brief: 焦虑的躯体化表现很常见，先排除躯体疾病，再考虑焦虑本身。
      - section: 第 2 节 焦虑与躯体反应 / 2.2 惊恐发作
        brief: 突然出现的强烈恐惧伴随心悸、胸闷、濒死感，通常数分钟到十几分钟达到高峰；反复出现应就医评估。
      - section: 第 2 节 焦虑与躯体反应 / 2.3 呼吸放松与着陆技巧
        brief: 缓慢腹式呼吸、把注意力放回当下感官（脚踩地面、看清周围五样东西），用于急性紧张时的自我安抚。
      - section: 第 3 节 睡眠问题 / 3.1 入睡困难
        brief: 躺下超过半小时睡不着；常见诱因包括作息不规律、睡前屏幕、白天久坐、情绪反刍。
      - section: 第 3 节 睡眠问题 / 3.2 早醒
        brief: 比平时早醒两小时以上且无法再入睡，是抑郁常见表现之一，值得告诉医生。
      - section: 第 3 节 睡眠问题 / 3.3 睡眠卫生建议
        brief: 固定起床时间、白天适量活动、午睡不超过半小时、睡前减少咖啡因与酒精。
      - section: 第 4 节 躯体不适与情绪 / 4.1 查不出原因的头痛乏力
        brief: 情绪问题常以躯体不适就诊；排除器质性问题后，应考虑情绪因素的影响。
      - section: 第 4 节 躯体不适与情绪 / 4.2 食欲与体重的变化
        brief: 短期内明显下降或上升都值得记录，并在就诊时告知医生。
      - section: 第 5 节 酒精与情绪
        brief: 用酒精助眠或缓解焦虑会形成依赖，并使睡眠结构与情绪问题更差。
      - section: 第 6 节 产后情绪变化
        brief: 产后情绪波动常见，但持续两周以上的低落、兴趣丧失或对婴儿的负面想法需要尽快求助。
      - section: 第 7 节 老年人情绪问题
        brief: 老年人常以躯体主诉、食欲下降、兴趣减少表达抑郁，容易被当成「年纪大了正常」。
      - section: 第 8 节 青少年情绪问题
        brief: 易激惹、成绩下降、拒绝上学、沉迷手机都可能是情绪问题的表现，而不是单纯的「不听话」。
      - section: 第 9 节 长期压力与耗竭
        brief: 情绪耗竭、去人格化（对人对事变得冷淡）、成就感下降三者同时出现时，提示需要调整节奏并求助。
      - section: 第 10 节 哀伤反应
        brief: 失去亲人后的悲伤通常会随时间波动减轻；一年后仍严重影响功能，或出现自伤念头时应求助。

  # ---------- 4. 危机干预流程（与 CrisisDetector 词表分工：知识 vs 拦截） ----------
  - doc_title: 危机识别与干预流程（合成语料）
    domain: 危机干预流程
    tags: [危机, 干预, 热线, 安全]
    topics:
      - section: 第 1 节 识别警示信号 / 1.1 言语信号
        brief: 说「活着没意思」「不想拖累别人」「已经想好了」这类表达，都属于需要认真对待的信号。
      - section: 第 1 节 识别警示信号 / 1.2 行为信号
        brief: 告别式行为、送出珍贵物品、突然异常平静、处理未了事务，都需要提高警觉。
      - section: 第 1 节 识别警示信号 / 1.3 情绪与处境信号
        brief: 极度绝望、强烈羞耻、重大丧失之后，以及独居、既往自伤史等处境因素。
      - section: 第 2 节 如何开口询问 / 2.1 直接问不会「教坏」对方
        brief: 已有充分证据表明，直接、关切地询问自杀念头不会诱导行为，反而常常缓解孤立感。
      - section: 第 2 节 如何开口询问 / 2.2 询问的顺序
        brief: 先建立联结与倾听，再逐步问「有没有想过伤害自己」「有没有具体打算」「有没有可用的手段」。
      - section: 第 2 节 如何开口询问 / 2.3 听到否定回答时
        brief: 不要用「那就好」结束话题，保持联系与关注，并在一段时间后再次确认。
      - section: 第 3 节 沟通的四个「不要」
        brief: 不要辩论对错、不要用激将法、不要承诺保密、不要让对方独自留下。
      - section: 第 4 节 降低身边的危险
        brief: 暂时移走或锁起可能造成伤害的物品与药物；这一步的具体做法应与专业人员沟通确定。
      - section: 第 5 节 立即求助的路径 / 5.1 拨打热线
        brief: 出现自杀念头且难以自控时，请立即拨打 12356 心理援助热线，或 120 / 110。
      - section: 第 5 节 立即求助的路径 / 5.2 联系信任的人
        brief: 让一位现实中的人陪在身边，比独自承受安全得多；把这份联系方式提前写下来。
      - section: 第 5 节 立即求助的路径 / 5.3 就诊
        brief: 到当地精神卫生中心或综合医院精神心理科就诊，说明近期出现的念头与打算。
      - section: 第 6 节 陪伴者自己的照顾
        brief: 陪伴者也会耗竭，需要轮换、休息，并允许自己求助；不要独自承担全部照护。
      - section: 第 7 节 度过危机之后
        brief: 危机缓解后仍有一段时间的高风险期，需要保持随访、按时复诊、减少重大生活变动。

  # ---------- 5. 药物常识（必须含遵医嘱限定语） ----------
  - doc_title: 抗抑郁药物常识（合成语料）
    domain: 药物常识
    tags: [药物, 常识, 遵医嘱]
    topics:
      - section: 第 1 节 基本认识 / 1.1 起效需要时间
        brief: 多数抗抑郁药需要两到四周才逐渐起效，早期看不到变化不等于无效。具体用药请遵医嘱。
      - section: 第 1 节 基本认识 / 1.2 疗程为什么较长
        brief: 症状缓解后通常还需继续服用一段时间以降低复发风险，疗程长短由医生判断。具体用药请遵医嘱。
      - section: 第 1 节 基本认识 / 1.3 不要自行加减量
        brief: 随意加减量或突然停药可能引起不适与症状反弹。任何调整都应与医生沟通。具体用药请遵医嘱。
      - section: 第 2 节 早期常见不适 / 2.1 恶心、胃口变化
        brief: 多在用药初期出现，常随适应而减轻；持续加重应联系医生。具体用药请遵医嘱。
      - section: 第 2 节 早期常见不适 / 2.2 头晕、乏力、口干
        brief: 起身时动作放慢，避免突然改变体位；影响生活时告知医生。具体用药请遵医嘱。
      - section: 第 2 节 早期常见不适 / 2.3 睡眠变化
        brief: 部分药物让人犯困、部分让人入睡困难，服药时间可由医生调整。具体用药请遵医嘱。
      - section: 第 3 节 需要及时联系医生的情况
        brief: 皮疹、持续高热、明显的心慌或意识改变、情绪急剧恶化或出现自伤念头，应尽快联系医生或就诊。具体用药请遵医嘱。
      - section: 第 4 节 漏服怎么办
        brief: 想起时若离下次服药时间还很久，可补服；接近下次服药时间则跳过，不要一次服两倍。具体用药请遵医嘱。
      - section: 第 5 节 与其他物质 / 5.1 酒精
        brief: 酒精会加重镇静作用、影响睡眠质量，并可能与药物相互作用，用药期间宜避免。具体用药请遵医嘱。
      - section: 第 5 节 与其他物质 / 5.2 其他药物与保健品
        brief: 包括感冒药、止痛药、中成药与保健品，都应在开药时告知医生。具体用药请遵医嘱。
      - section: 第 6 节 关于停药
        brief: 停药应由医生评估后逐步减量；突然停用可能出现头晕、烦躁、睡眠紊乱等反应。具体用药请遵医嘱。
      - section: 第 7 节 常见误区
        brief: 「吃了就停不下来」「会改变性格」「是意志力不够才吃药」都是常见误解。药物是治疗手段之一，具体请遵医嘱。

  # ---------- 6. 就诊与转介指引（对齐医生推荐逻辑） ----------
  - doc_title: 就诊与转介指引（合成语料）
    domain: 就诊与转介指引
    tags: [就诊, 转介, 挂号]
    topics:
      - section: 第 1 节 什么时候该看医生
        brief: 症状持续两周以上、明显影响工作学习与人际关系、或出现自伤念头时，建议尽快就诊。
      - section: 第 1 节 什么时候该看医生 / 1.2 越早越好
        brief: 早期干预通常疗程更短、效果更好；等到「撑不住了」再去，往往需要更长时间恢复。
      - section: 第 2 节 去哪里看 / 2.1 精神专科医院
        brief: 适合症状较重、需要明确诊断与用药评估的情况；通常设有情绪障碍、焦虑、睡眠等专病门诊。
      - section: 第 2 节 去哪里看 / 2.2 综合医院精神心理科
        brief: 适合同时存在躯体疾病、或希望就近就诊的情况；通常与内科协作更方便。
      - section: 第 2 节 去哪里看 / 2.3 社区卫生服务中心
        brief: 适合轻度问题、随访与开药续方；需要复杂评估时会转介到上级机构。
      - section: 第 3 节 就诊前准备
        brief: 记下症状出现时间与波动、睡眠与食欲变化、既往用药与效果、家族史，以及最想解决的问题。
      - section: 第 4 节 就诊时怎么描述
        brief: 描述频率、持续时间、对生活的影响比形容感受更容易被理解；不确定就照实说。
      - section: 第 5 节 心理咨询与药物治疗的关系
        brief: 两者可以并行：药物主要改善症状，心理治疗帮助理解与应对方式，是否需要联合由专业人员评估。
      - section: 第 6 节 复诊与随访
        brief: 按医嘱复诊，即使感觉好转也不要自行停诊；复诊时如实说明用药后的变化。
      - section: 第 7 节 家人可以做什么
        brief: 陪同就诊、帮助记录、提供稳定的陪伴，避免评判与催促，也照顾好自己的状态。
      - section: 第 8 节 选择医生时的参考维度
        brief: 科室方向、擅长领域、职称与出诊时间都可以作为参考；与医生的沟通感受同样重要。
      - section: 第 9 节 紧急情况怎么办
        brief: 出现明确自伤念头或冲动时，立即拨打 12356 或前往就近急诊，不要等待预约。
